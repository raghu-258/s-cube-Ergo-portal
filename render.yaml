# Render blueprint: one web service runs the Node.js API and serves the React site.
# Every git push to the main branch rebuilds and redeploys it. See README.md, "Deploy to Render".
services:
  - type: web
    name: scube-portal
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    # --include=dev: the React build tools are dev dependencies, and NODE_ENV=production would skip them.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ALLOWED_DOMAIN
        value: scube-ergo.com
      - key: ADMIN_EMAILS
        value: raghu@scube-ergo.com
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: ALL_EMPLOYEES_EMAIL
        value: team@scube-ergo.com
      # Test mode: daily wishes only go here. Delete this variable in the Render dashboard to go live.
      - key: TEST_RECIPIENT
        value: raghu@scube-ergo.com
      - key: TEST_EMAIL_RECIPIENTS
        value: raghu@scube-ergo.com,sneha@scube-ergo.com
      - key: MAIL_FROM
        value: Scube Celebrations <raghu@scube-ergo.com>
      # Filled in on the Render dashboard (never committed):
      - key: DATABASE_URL
        sync: false
      - key: GCS_BUCKET
        sync: false
      - key: GCS_CREDENTIALS
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: PORTAL_URL
        sync: false
