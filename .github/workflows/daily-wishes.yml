# Runs the birthday & work-anniversary job every morning by calling the portal.
# Render's free plan sleeps when idle, so this also wakes it up and retries while it starts.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   PORTAL_URL   e.g. https://scube-portal.onrender.com
#   CRON_SECRET  the CRON_SECRET value from the Render dashboard
name: Daily birthday & anniversary emails

on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC = 8:00 AM India time. GitHub may start it a few minutes late.
  workflow_dispatch: {} # lets you run it by hand from the Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call the daily job
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          for attempt in 1 2 3 4; do
            code=$(curl -s -o result.json -w '%{http_code}' --max-time 120 -X POST \
              -H "X-Cron-Secret: $CRON_SECRET" "$PORTAL_URL/api/cron/daily-wishes" || true)
            if [ "$code" = "200" ]; then cat result.json; exit 0; fi
            echo "Attempt $attempt: got HTTP $code, retrying in 30 seconds (the portal may be waking up)"
            sleep 30
          done
          echo "The daily job did not succeed"; exit 1
